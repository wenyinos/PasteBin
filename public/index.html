<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code PasteBin</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/prism-tomorrow.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <script>
    /* 尽早设置主题，避免页面闪烁 */
    (function () {
      var t = localStorage.getItem('theme');
      if (!t) {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <!-- 导航栏 -->
  <nav id="navbar-main" class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="?">
        <span class="brand-mark"><i class="bi bi-code-slash"></i></span>Code PasteBin
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMobile"
              aria-controls="navbarMobile" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMobile">
        <!-- 居中新建按钮 -->
        <div class="d-flex justify-content-center flex-grow-1 my-2 my-lg-0">
          <button id="newPasteBtn" class="btn-nav-ghost" onclick="showCreateModal()" style="display:none;">
            <i class="bi bi-plus-circle me-1"></i>新建代码片段
          </button>
        </div>

        <!-- 右侧导航 -->
        <div class="d-flex align-items-center justify-content-center justify-content-lg-end gap-2">
          <div id="userNav" class="align-items-center gap-2" style="display:none;">
            <span id="usernameDisplay" class="nav-text font-small"></span>
            <button id="logoutBtn" class="btn-nav-ghost">退出</button>
          </div>
          <div id="guestNav" class="align-items-center gap-2" style="display:none;">
            <button class="btn-nav-solid" onclick="goLogin()">登录</button>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" title="切换日间/夜间模式" aria-label="切换日间/夜间模式">
            <i class="bi bi-moon-stars"></i>
            <i class="bi bi-sun"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <!-- 公共查看视图 -->
    <section class="section" id="publicView" style="display:none;">
      <div class="container">
        <div class="paste-card">
          <div class="paste-card-head d-flex justify-content-between align-items-center">
            <span><i class="bi bi-person-circle me-2"></i>来自: <strong id="pasteAuthor"></strong></span>
            <div>
              <span id="displayPasteLanguage" class="badge-soft me-2"></span>
              <small class="text-soft font-small" id="pasteTime"><i class="bi bi-clock me-1"></i></small>
            </div>
          </div>
          <div class="paste-card-body">
            <pre><code id="publicContent" class="language-plaintext"></code></pre>
          </div>
          <div class="paste-card-foot">
            <a id="shareLink" href="#" class="btn-brand-outline">
              <i class="bi bi-link-45deg me-1"></i>分享链接
            </a>
            <button class="btn-brand ms-2" onclick="copyAllCode(this)">
              <i class="bi bi-clipboard me-1"></i>全部复制
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 主内容区域 -->
    <section id="mainSection">
      <div class="section">
        <div class="container">
          <div class="d-flex align-items-center mb-4">
            <h4 class="section-title mb-0 h3">最新分享</h4>
            <button class="btn-brand-outline ms-3" onclick="loadAllPastes()">
              <i class="bi bi-arrow-clockwise me-1"></i>刷新
            </button>
          </div>
          <div id="pastesList" data-v="20260410a"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 新建Paste模态框 -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">新建Paste</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">语言</label>
            <select class="form-select" id="pasteLanguage">
              <option value="plaintext">纯文本</option>
              <option value="javascript">JavaScript</option>
              <option value="typescript">TypeScript</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="csharp">C#</option>
              <option value="cpp">C++</option>
              <option value="c">C</option>
              <option value="go">Go</option>
              <option value="rust">Rust</option>
              <option value="php">PHP</option>
              <option value="ruby">Ruby</option>
              <option value="swift">Swift</option>
              <option value="kotlin">Kotlin</option>
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="scss">SCSS</option>
              <option value="json">JSON</option>
              <option value="xml">XML</option>
              <option value="yaml">YAML</option>
              <option value="markdown">Markdown</option>
              <option value="sql">SQL</option>
              <option value="bash">Bash</option>
              <option value="powershell">PowerShell</option>
              <option value="dockerfile">Dockerfile</option>
            </select>
          </div>
          <textarea class="form-control mb-3" id="pasteContent" rows="10" placeholder="输入内容..."></textarea>
          <button class="btn-brand" onclick="doCreatePaste()">
            <i class="bi bi-check-lg me-1"></i>保存
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer pt-5 pb-4">
    <div class="container">
      <div class="d-flex flex-column align-items-center">
        <p class="fw-bold mb-2">Code PasteBin</p>
        <div class="mb-2">
          <a href="https://github.com/wenyinos/PasteBin" target="_blank" class="me-3">
            <i class="bi bi-github"></i> GitHub
          </a>
          <a href="https://wenyinos.com" target="_blank">
            <i class="bi bi-house"></i> 项目主页
          </a>
        </div>
        <small class="text-soft">Copyleft &copy; 玟茵开源社区 2013-2026</small>
      </div>
    </div>
  </footer>

  <script src="/js/bootstrap.bundle.min.js"></script>
  <script src="/js/prism.js"></script>
  <script src="/js/components/prism-markup.min.js"></script>
  <script src="/js/components/prism-css.min.js"></script>
  <script src="/js/components/prism-clike.min.js"></script>
  <script src="/js/components/prism-javascript.min.js"></script>
  <script src="/js/components/prism-typescript.min.js"></script>
  <script src="/js/components/prism-python.min.js"></script>
  <script src="/js/components/prism-java.min.js"></script>
  <script src="/js/components/prism-c.min.js"></script>
  <script src="/js/components/prism-cpp.min.js"></script>
  <script src="/js/components/prism-csharp.min.js"></script>
  <script src="/js/components/prism-go.min.js"></script>
  <script src="/js/components/prism-rust.min.js"></script>
  <script src="/js/components/prism-markup-templating.min.js"></script>
  <script src="/js/components/prism-php.min.js"></script>
  <script src="/js/components/prism-ruby.min.js"></script>
  <script src="/js/components/prism-swift.min.js"></script>
  <script src="/js/components/prism-kotlin.min.js"></script>
  <script src="/js/components/prism-scss.min.js"></script>
  <script src="/js/components/prism-json.min.js"></script>
  <script src="/js/components/prism-yaml.min.js"></script>
  <script src="/js/components/prism-markdown.min.js"></script>
  <script src="/js/components/prism-sql.min.js"></script>
  <script src="/js/components/prism-bash.min.js"></script>
  <script src="/js/components/prism-powershell.min.js"></script>
  <script src="/js/components/prism-docker.min.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    const API_URL = '/api';
    let token = localStorage.getItem('token');
    let createModal;
    let ssoConfig = { loginUrl: '', logoutUrl: '' };

    const langLabels = {
      plaintext: '纯文本', javascript: 'JavaScript', typescript: 'TypeScript',
      python: 'Python', java: 'Java', csharp: 'C#', cpp: 'C++', c: 'C',
      go: 'Go', rust: 'Rust', php: 'PHP', ruby: 'Ruby', swift: 'Swift',
      kotlin: 'Kotlin', html: 'HTML', css: 'CSS', scss: 'SCSS',
      json: 'JSON', xml: 'XML', yaml: 'YAML', markdown: 'Markdown',
      sql: 'SQL', bash: 'Bash', powershell: 'PowerShell', dockerfile: 'Dockerfile'
    };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    function decodeJwtPayload(jwtToken) {
      try {
        if (!jwtToken) return null;
        const parts = jwtToken.split('.');
        if (parts.length < 2) return null;
        let payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (payload.length % 4 !== 0) payload += '=';
        return JSON.parse(atob(payload));
      } catch {
        return null;
      }
    }

    function getCurrentUser() {
      const payload = decodeJwtPayload(token);
      if (!payload || typeof payload !== 'object') return null;
      if (!payload.username) return null;
      return payload;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      createModal = new bootstrap.Modal(document.getElementById('createModal'));
      await loadConfig();
      if (token) {
        updateNav();
      } else {
        // 未持有本地令牌时静默尝试统一认证兑换（浏览器携带中心票据即可自动登录）
        const ssoOk = await trySilentSSO();
        if (!ssoOk) updateNav();
      }

      const shortCode = getQueryParam('s');
      if (shortCode) {
        const loaded = await loadPublicPaste();
        if (!loaded) await loadAllPastes();
      } else {
        await loadAllPastes();
      }
    });

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    async function loadPublicPaste() {
      const shortCode = getQueryParam('s');
      if (!shortCode) return false;

      try {
        const res = await fetch('/api/paste/' + shortCode);
        if (!res.ok) return false;

        const paste = await res.json();

        document.getElementById('pasteAuthor').textContent = paste.username;
        document.getElementById('pasteTime').textContent = new Date(paste.created_at).toLocaleString();
        document.getElementById('displayPasteLanguage').textContent = langLabels[paste.language] || paste.language;

        const codeEl = document.getElementById('publicContent');
        codeEl.className = '';
        codeEl.classList.add('language-' + (paste.language || 'plaintext'));
        codeEl.textContent = paste.content;

        try { Prism.highlightElement(codeEl); } catch (e) { console.warn('Prism highlight failed:', e); }

        const fullUrl = window.location.origin + window.location.pathname + '?s=' + paste.short_code;
        document.getElementById('shareLink').href = fullUrl;
        document.getElementById('shareLink').innerHTML = '<i class="bi bi-link-45deg me-1"></i>分享链接: ' + fullUrl;

        document.getElementById('mainSection').style.display = 'none';
        document.getElementById('publicView').style.display = 'block';

        return true;
      } catch (e) {
        return false;
      }
    }

    function updateNav() {
      try {
        if (token) {
          const user = getCurrentUser();
          if (!user) throw new Error('Invalid token payload');
          document.getElementById('usernameDisplay').textContent = user.username;
          document.getElementById('userNav').style.display = 'flex';
          document.getElementById('guestNav').style.display = 'none';
          document.getElementById('newPasteBtn').style.display = 'inline-flex';
        } else {
          document.getElementById('userNav').style.display = 'none';
          document.getElementById('guestNav').style.display = 'flex';
          document.getElementById('newPasteBtn').style.display = 'none';
        }
      } catch (e) {
        console.error('updateNav error:', e);
        token = null;
        localStorage.removeItem('token');
        document.getElementById('userNav').style.display = 'none';
        document.getElementById('guestNav').style.display = 'flex';
        document.getElementById('newPasteBtn').style.display = 'none';
      }
    }

    async function loadAllPastes() {
      try {
        const res = await fetch('/api/pastes/all');
        if (!res.ok) throw new Error('API error: ' + res.status);
        const pastes = await res.json();

        document.getElementById('mainSection').style.display = 'block';
        document.getElementById('publicView').style.display = 'none';

        const list = document.getElementById('pastesList');
        if (!pastes.length) {
          list.innerHTML = '<p class="text-soft text-center font-small">暂无内容</p>';
          return;
        }
        const currentUser = getCurrentUser();
        list.innerHTML = pastes.map(p => {
          const isOwner = !!(currentUser && currentUser.username === p.username);
          const safeUsername = escapeHtml(p.username);
          const safeLanguage = escapeHtml(langLabels[p.language] || p.language);
          return `
          <div class="paste-card mb-3">
            <div class="paste-card-body">
              <div class="paste-meta-row d-flex justify-content-between align-items-start mb-2">
                <div class="paste-meta">
                  <span class="badge-soft"><i class="bi bi-code-square me-1"></i>${safeLanguage}</span>
                  <span class="text-soft font-small ms-2"><i class="bi bi-person me-1"></i>${safeUsername}</span>
                  <small class="text-soft font-small ms-2"><i class="bi bi-clock me-1"></i>${new Date(p.created_at).toLocaleString()}</small>
                </div>
                <div class="paste-actions">
                  <a href="?s=${p.short_code}" class="btn-brand-outline">
                    <i class="bi bi-eye me-1"></i>访问
                  </a>
                  ${isOwner ? `<button class="btn btn-sm btn-outline-danger ms-1" onclick="deletePaste(${p.id})"><i class="bi bi-trash me-1"></i>删除</button>` : ''}
                </div>
              </div>
              <div class="paste-summary">${escapeHtml(p.content)}</div>
            </div>
          </div>
        `}).join('');
      } catch (e) {
        console.error(e);
        document.getElementById('mainSection').style.display = 'block';
        document.getElementById('publicView').style.display = 'none';
        const errorMsg = e.message || e.toString() || 'Unknown error';
        const errP = document.createElement('p');
        errP.className = 'text-soft text-center font-small';
        errP.textContent = '加载失败: ' + errorMsg;
        document.getElementById('pastesList').textContent = '';
        document.getElementById('pastesList').appendChild(errP);
      }
    }

    async function deletePaste(id) {
      if (!confirm('确定要删除这条代码吗？')) return;
      try {
        const res = await fetch(`${API_URL}/pastes/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) { loadAllPastes(); return; }
        const data = await res.json().catch(() => ({}));
        if (res.status === 403) {
          // 站点准入被撤销：定向回认证中心
          const target = data.loginUrl || ssoConfig.loginUrl;
          if (target) { window.location.href = target; return; }
        }
        if (res.status === 401) {
          token = null;
          localStorage.removeItem('token');
          updateNav();
        }
        alert(data.error || '删除失败');
      } catch (e) {
        alert('删除失败: ' + e.message);
      }
    }

    function copyAllCode(btn) {
      const code = document.getElementById('publicContent').textContent;
      const originalHtml = btn.innerHTML;

      function onSuccess() {
        btn.innerHTML = '<i class="bi bi-check me-1"></i>已复制';
        btn.disabled = true;
        setTimeout(() => { btn.innerHTML = originalHtml; btn.disabled = false; }, 2000);
      }

      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(onSuccess).catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }

      function fallbackCopy() {
        const textarea = document.createElement('textarea');
        textarea.value = code;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); onSuccess(); }
        catch { alert('复制失败，请手动选择复制'); }
        document.body.removeChild(textarea);
      }
    }

    function goLogin() {
      if (ssoConfig.loginUrl) {
        window.location.href = ssoConfig.loginUrl;
      } else {
        alert('统一认证未启用，请联系社区管理员');
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch(`${API_URL}/config`);
        if (res.ok) ssoConfig = await res.json();
      } catch { /* 配置不可达时保留默认（空） */ }
    }

    async function trySilentSSO() {
      try {
        const res = await fetch(`${API_URL}/sso`);
        if (res.status === 403) {
          // 账号未开通本站：定向回认证中心（已登录时自动进入面板查看提示）
          const data = await res.json().catch(() => ({}));
          const target = data.loginUrl || ssoConfig.loginUrl;
          if (target) { window.location.href = target; return true; }
          return false;
        }
        if (!res.ok) return false;
        const data = await res.json();
        if (!data.token) return false;
        token = data.token;
        localStorage.setItem('token', token);
        updateNav();
        return true;
      } catch {
        return false;
      }
    }

    function showCreateModal() {
      document.getElementById('pasteContent').value = '';
      document.getElementById('pasteLanguage').value = 'plaintext';
      createModal.show();
    }

    async function doCreatePaste() {
      const content = document.getElementById('pasteContent').value;
      const language = document.getElementById('pasteLanguage').value;
      if (!content.trim()) return alert('内容不能为空');
      const res = await fetch(`${API_URL}/pastes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ content, language })
      });
      if (!res.ok) {
        let data = {};
        try { data = await res.json(); } catch {}
        if (res.status === 403) {
          // 站点准入被撤销：定向回认证中心
          const target = data.loginUrl || ssoConfig.loginUrl;
          if (target) { window.location.href = target; return; }
        }
        if (res.status === 401) {
          token = null;
          localStorage.removeItem('token');
          updateNav();
        }
        alert(data.error || `创建失败 (${res.status})`);
        return;
      }
      const data = await res.json();
      createModal.hide();
      window.location.href = '?s=' + data.short_code;
    }

    document.getElementById('logoutBtn').onclick = () => {
      token = null;
      localStorage.removeItem('token');
      // 全域登出：跳转认证中心退出页（销毁中心票据后回登录页）
      window.location.href = ssoConfig.logoutUrl || '/';
    };
  </script>
</body>
</html>
